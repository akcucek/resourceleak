name: deploy
on: { workflow_dispatch: {} }          # run manually from the Actions tab
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: resourceleak
          region: asia-south1
          source: .
          env_vars: GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT }},BQ_DATASET=resourceleak,RL_DB=/tmp/resourceleak.sqlite3
          secrets: GOOGLE_MAPS_API_KEY=maps-key:latest
